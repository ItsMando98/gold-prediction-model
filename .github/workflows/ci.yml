name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gold
          POSTGRES_PASSWORD: gold
          POSTGRES_DB: gold_prediction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://gold:gold@localhost:5432/gold_prediction_test
      DATABASE_URL: postgresql+psycopg://gold:gold@localhost:5432/gold_prediction_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
